name: Update market indicators

on:
  schedule:
    # Every 6 hours — macro values change daily at most; F&G moves intraday
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch indicators
        run: python3 scripts/fetch_indicators.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicators.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update indicators $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
